# Nginx configuration for finanzas-intranet
# Location: /etc/nginx/sites-available/finanzas-intranet
# Enable: sudo ln -s /etc/nginx/sites-available/finanzas-intranet /etc/nginx/sites-enabled/

# ─── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name TU_DOMINIO;

    # SSL — gestionado por Certbot (no editar manualmente)
    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/finanzas-intranet/current;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header X-XSS-Protection         "1; mode=block"                    always;
    # CSP permisiva pero segura: permite Supabase, Google Fonts, inline styles de Tailwind
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none';" always;

    # ── index.html: nunca cachear (SPA entry point) ─────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # ── Hashed assets: cache agresivo ───────────────────────────────────────
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── robots.txt y manifest ────────────────────────────────────────────────
    location ~* \.(txt|json|webmanifest)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── SPA fallback: todas las rutas React ─────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/finanzas-intranet.access.log;
    error_log  /var/log/nginx/finanzas-intranet.error.log warn;

    # ── No servir archivos ocultos ni sensibles ──────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
